name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# Jobs raise what they need; nothing else gets write access.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
      rclone: ${{ steps.rclone.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Only the highest release moves `latest` (image tag and GitHub
      # release): a patch tag pushed for an older line must not roll it back.
      - name: Is this the highest release
        id: latest
        run: |
          highest="$(git tag --list | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          if [ "$highest" = "$GITHUB_REF_NAME" ]; then latest=true; else latest=false; fi
          echo "highest release tag: $highest, this one: $GITHUB_REF_NAME, latest: $latest"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      # Resolved once, so that every platform build ships the same rclone.
      - name: Resolve rclone version
        id: rclone
        run: |
          version="$(curl -fsSL https://downloads.rclone.org/version.txt | awk '{print $2}')"
          case "$version" in
            v[0-9]*) ;;
            *) echo "unexpected rclone version: '$version'" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: shellcheck
        run: shellcheck entrypoint.sh entrypoint.minimal.sh entrypoint.incus.sh tests/smoke.sh tests/smoke.incus.sh scripts/create_incus_alpine.sh scripts/create_incus_debian13.sh

      - name: Compose files
        run: |
          for f in docker-compose.yml docker-compose.bind.yml docker-compose.minimal.bind.yml docker-compose.incus.yml; do
            docker compose -f "$f" config -q
          done

  build:
    name: build-${{ matrix.variant }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            image_suffix: ""
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            dockerfile: Dockerfile
          - variant: full
            image_suffix: ""
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: Dockerfile
          - variant: minimal
            image_suffix: "-minimal"
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            dockerfile: Dockerfile.minimal
          - variant: minimal
            image_suffix: "-minimal"
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: Dockerfile.minimal
          - variant: incus
            image_suffix: "-incus"
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            dockerfile: Dockerfile.incus
          - variant: incus
            image_suffix: "-incus"
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: Dockerfile.incus
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lowercase image name
        run: echo "IMAGE_LC=${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Add image variant
        run: echo "IMAGE_LC=${IMAGE_LC}${{ matrix.image_suffix }}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE_LC }}
          tags: |
            type=semver,pattern={{version}}

      # From scratch on every release: with a layer cache the `apk add` layer
      # never changes until the Dockerfile does, so releases would keep
      # shipping the same packages without their security fixes.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DIND_RCLONE_VERSION=${{ needs.prepare.outputs.rclone }}
          no-cache: true
          pull: true
          outputs: type=image,name=${{ env.IMAGE_LC }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The exact digest that would be tagged, on its native runner. Nothing is
  # tagged unless all six pass.
  smoke:
    name: smoke-${{ matrix.variant }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: build
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            image_suffix: ""
            arch: amd64
            runner: ubuntu-24.04
            script: tests/smoke.sh
          - variant: full
            image_suffix: ""
            arch: arm64
            runner: ubuntu-24.04-arm
            script: tests/smoke.sh
          - variant: minimal
            image_suffix: "-minimal"
            arch: amd64
            runner: ubuntu-24.04
            script: tests/smoke.sh
          - variant: minimal
            image_suffix: "-minimal"
            arch: arm64
            runner: ubuntu-24.04-arm
            script: tests/smoke.sh
          - variant: incus
            image_suffix: "-incus"
            arch: amd64
            runner: ubuntu-24.04
            script: tests/smoke.incus.sh
          - variant: incus
            image_suffix: "-incus"
            arch: arm64
            runner: ubuntu-24.04-arm
            script: tests/smoke.incus.sh
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lowercase image name
        run: echo "IMAGE_LC=${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')${{ matrix.image_suffix }}" >> "$GITHUB_ENV"

      - name: Download digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke test
        run: |
          image="${IMAGE_LC}@sha256:$(ls "${{ runner.temp }}/digests")"
          docker pull "$image"
          bash ${{ matrix.script }} "$image" 3

  merge:
    name: manifest-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    needs: [prepare, lint, smoke]
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    strategy:
      matrix:
        include:
          - variant: full
            image_suffix: ""
          - variant: minimal
            image_suffix: "-minimal"
          - variant: incus
            image_suffix: "-incus"
    steps:
      - name: Lowercase image name
        id: names
        run: echo "image=${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # latest=false: the action would otherwise add `latest` to every semver
      # tag on its own; the raw tag below applies it to the highest only.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ needs.prepare.outputs.latest == 'true' }}

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # shellcheck disable=SC2046 # split on purpose: one -t per tag, one ref per digest
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.names.outputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.names.outputs.image }}:${{ steps.meta.outputs.version }}

  release:
    name: github-release
    runs-on: ubuntu-24.04
    needs: [prepare, merge]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Release assets are for pulling: strip the build: block (its context
      # is not in the download) and pin image: to this version.
      - name: Stamp composes
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.merge.outputs.version }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          base = os.environ["IMAGE_BASE"].lower()
          version = os.environ["VERSION"]
          for filename, suffix in (
            ("docker-compose.yml", ""),
            ("docker-compose.bind.yml", ""),
            ("docker-compose.minimal.bind.yml", "-minimal"),
            ("docker-compose.incus.yml", "-incus"),
          ):
            image = f"{base}{suffix}:{version}"
            p = Path(filename)
            out = []
            skip = False
            for line in p.read_text().splitlines(True):
              if line.startswith("    build:"):
                skip = True
                continue
              if skip:
                if line.startswith("    ") and not line.startswith("      "):
                  skip = False
                else:
                  continue
              if line.startswith("    image:"):
                out.append(f"    image: {image}\n")
                continue
              out.append(line)
            assert not any(l.startswith("    build:") for l in out), filename
            assert f"    image: {image}\n" in out, filename
            p.write_text("".join(out))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          make_latest: ${{ needs.prepare.outputs.latest }}
          files: |
            docker-compose.yml
            docker-compose.bind.yml
            docker-compose.minimal.bind.yml
            docker-compose.incus.yml
