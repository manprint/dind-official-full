name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build-${{ matrix.variant }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            image_suffix: ""
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            dockerfile: Dockerfile
          - variant: full
            image_suffix: ""
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: Dockerfile
          - variant: minimal
            image_suffix: "-minimal"
            arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            dockerfile: Dockerfile.minimal
          - variant: minimal
            image_suffix: "-minimal"
            arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: Dockerfile.minimal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        run: echo "IMAGE_LC=${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Add image variant
        run: echo "IMAGE_LC=${IMAGE_LC}${{ matrix.image_suffix }}" >> "$GITHUB_ENV"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_LC }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_LC }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.platform }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: manifest-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    needs: build
    outputs:
      version: ${{ steps.meta.outputs.version }}
    strategy:
      matrix:
        include:
          - variant: full
            image_suffix: ""
          - variant: minimal
            image_suffix: "-minimal"
    steps:
      - name: Lowercase image name
        id: names
        run: echo "image=${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest

      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.names.outputs.image }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ steps.names.outputs.image }}:${{ steps.meta.outputs.version }}

  release:
    name: github-release
    runs-on: ubuntu-24.04
    needs: merge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp bind composes
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.merge.outputs.version }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          base = os.environ["IMAGE_BASE"].lower()
          version = os.environ["VERSION"]
          for filename, suffix in (
            ("docker-compose.bind.yml", ""),
            ("docker-compose.minimal.bind.yml", "-minimal"),
          ):
            image = f"{base}{suffix}:{version}"
            p = Path(filename)
            out = []
            skip = False
            for line in p.read_text().splitlines(True):
              if line.startswith("    build:"):
                skip = True
                continue
              if skip:
                if line.startswith("    ") and not line.startswith("      "):
                  skip = False
                else:
                  continue
              if line.startswith("    image:"):
                out.append(f"    image: {image}\n")
                continue
              out.append(line)
            p.write_text("".join(out))
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            docker-compose.bind.yml
            docker-compose.minimal.bind.yml
            docker-compose.yml
            Dockerfile
            Dockerfile.minimal
